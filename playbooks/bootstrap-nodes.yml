# Bootstraps SSH key access for the Proxmox VE hosts themselves (node1/node2).
# Deliberately separate from playbooks/bootstrap.yml, which sets up a `nihar`
# user, passwordless sudo, fish, upterm, etc. — none of that applies here,
# these hosts are accessed directly as root and need nothing but key auth.
- name: Bootstrap Proxmox VE hosts (SSH key access for root)
  hosts: proxmox_nodes
  gather_facts: false

  pre_tasks:
    - ansible.builtin.import_tasks: tasks/ensure-ssh-key-trust.yml

  tasks:
    - name: Ensure control node's public key is authorized for root
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
