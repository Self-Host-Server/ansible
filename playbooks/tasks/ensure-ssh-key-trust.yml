- name: Ensure control node has an SSH keypair
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
    creates: ~/.ssh/id_ed25519
  delegate_to: localhost
  run_once: true

- name: Check if host key is already known
  ansible.builtin.shell: "ssh-keygen -F {{ ansible_host }}"
  delegate_to: localhost
  register: known_host_check
  failed_when: false
  changed_when: false

- name: Accept and store this host's SSH key
  ansible.builtin.shell: "ssh-keyscan -H {{ ansible_host }} >> ~/.ssh/known_hosts"
  delegate_to: localhost
  when: known_host_check.rc != 0
