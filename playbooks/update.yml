- name: Rotating snapshot, then update apt and Docker
  hosts: containers:selfhost
  serial: 1
  become: true
  gather_facts: false
  vars:
    snapshot_total: 5
    snapshot_state_dir: "{{ lookup('env', 'HOME') }}/.ansible/proxmox-snapshots"
    snapshot_date: "{{ '%Y-%m-%d' | strftime }}"

  tasks:
    - name: Rotating snapshot
      tags: [snapshot]
      block:
        - name: Ensure snapshot state directory exists
          ansible.builtin.file:
            path: "{{ snapshot_state_dir }}"
            state: directory
            mode: "0755"
          delegate_to: localhost

        - name: Initialize snapshot index if absent
          ansible.builtin.copy:
            dest: "{{ snapshot_state_dir }}/ct{{ vmid }}_index"
            content: "1\n"
            force: false
            mode: "0644"
          delegate_to: localhost

        - name: Read snapshot index
          ansible.builtin.slurp:
            src: "{{ snapshot_state_dir }}/ct{{ vmid }}_index"
          register: snap_index_raw
          delegate_to: localhost

        - name: Set snapshot name
          ansible.builtin.set_fact:
            snap_index: "{{ snap_index_raw.content | b64decode | trim | int }}"
            snap_name: "snapshot_{{ snap_index_raw.content | b64decode | trim | int }}"

        - name: Remove old snapshot in this slot (if present)
          community.general.proxmox_snap:
            api_host: "{{ proxmox_api_host }}"
            api_user: "{{ proxmox_api_user }}"
            api_token_id: "{{ proxmox_token_id }}"
            api_token_secret: "{{ proxmox_token_secret }}"
            vmid: "{{ vmid }}"
            snapname: "{{ snap_name }}"
            state: absent
            force: true
            timeout: 300
          delegate_to: localhost

        - name: Create snapshot
          community.general.proxmox_snap:
            api_host: "{{ proxmox_api_host }}"
            api_user: "{{ proxmox_api_user }}"
            api_token_id: "{{ proxmox_token_id }}"
            api_token_secret: "{{ proxmox_token_secret }}"
            vmid: "{{ vmid }}"
            snapname: "{{ snap_name }}"
            description: "Before update on {{ snapshot_date }}"
            state: present
            timeout: 300
          delegate_to: localhost

        - name: Advance snapshot index
          ansible.builtin.copy:
            dest: "{{ snapshot_state_dir }}/ct{{ vmid }}_index"
            content: "{{ (snap_index | int % snapshot_total) + 1 }}\n"
            mode: "0644"
          delegate_to: localhost

    - ansible.builtin.import_tasks: tasks/apt-update-and-reboot.yml

    - ansible.builtin.import_tasks: tasks/update-docker-compose-stacks.yml

    - name: Run make update
      ansible.builtin.command:
        cmd: make update
        chdir: "{{ makefile_dir }}"
      become: false
      when: update_method | default('compose') == 'makefile'
      changed_when: true

    - ansible.builtin.import_tasks: tasks/prune-docker-images.yml
