# =============================================================================
# GIT-CLIFF — PR description generator
# =============================================================================

[tool.git-cliff.changelog]
header = ""
body = """
## Summary
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}

## Test plan

- [ ] Review the changes above
- [ ] Existing tests pass
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "✨ Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^docs", group = "📚 Documentation" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^chore", group = "🔧 Chores" },
  { message = "^lint", group = "🔧 Chores" },
  { message = ".*", group = "📝 Changes" },
]

# =============================================================================
# RUFF — Python linter & formatter
# =============================================================================

[tool.ruff]
line-length = 180
exclude = ["__pycache__", "venv", ".tox", ".venv", "tests.py", "env"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E203", "E501", "E701", "E401", "B008"]


# =============================================================================
# TOX — Test & task runner
# =============================================================================

# Default envs run when you type `tox` with no arguments
[tool.tox]
env_list = [
  "lint",
  "txt-lint",
  "format",
  "prettier",
  "toml-lint",
  "duplicate-code",
]
work_dir = "/tmp/.tox"

# Shared base config inherited by all envs
[tool.tox.env_run_base]
pass_env = ["PATH"]
set_env = { VIRTUALENV_OVERRIDE_APP_DATA = "{work_dir}/.virtualenv", PRETTIER_GLOB = "**/*.{css,js,html,json,yml,yaml,md}" }

# --- Linting ----------------------------------------------------------------

[tool.tox.env.lint]
skip_install = true
base_python = "python3"
deps = ["ruff"]
commands = [["ruff", "check", "--no-cache", "."]]

[tool.tox.env."txt-lint"]
skip_install = true
allowlist_externals = ["npx", "npm"]
commands = [
  [
    "npm",
    "install",
    "--save-dev",
    "textlint",
    "textlint-rule-common-misspellings",
    "textlint-rule-write-good",
  ],
  [
    "npx",
    "textlint",
    "--rule",
    "common-misspellings",
    "--rule",
    "write-good",
    "**/*.txt",
  ],
]

