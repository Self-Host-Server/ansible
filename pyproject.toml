# --- Docs ---------------------------------------------------------------

# Renders *.md.template files (see scripts/render_env_docs.py), substituting
# ${VAR} / ${VAR:-default} / ${VAR:?message} references from .env, same
# syntax as compose.yml. Not part of the "all"/"github" chains -- run it
# explicitly (or via `make render-docs`) since it writes files and its
# output can embed values from .env that shouldn't be committed if they're
# secrets. Safe to leave enabled even in repos with no *.md.template files;
# it's a no-op then.
[tool.tox.env."render-docs"]
skip_install = true
deps = []
commands = [["python3", "scripts/render_env_docs.py"]]

# --- Formatting -------------------------------------------------------------

[tool.tox.env.format]
skip_install = true
deps = ["ruff", "ty"]
allowlist_externals = ["npx"]
commands = [
  # [
  #   "python3",
  #   "Python/scripts/combined_imports_check.py",
  #   "--fix",
  # ],
  ["ruff", "format", "--no-cache", "--verbose", "."],
  ["ruff", "check", "--no-cache", "--fix", "--verbose", "."],
  ["npx", "prettier", "--write", "--log-level", "log", "{env:PRETTIER_GLOB}"],
  ["npx", "@taplo/cli", "fmt", "--no-auto-config", "**/*.toml"],
]

# [tool.tox.env.scss]
# skip_install = true
# allowlist_externals = ["npx"]
# commands = [["npx", "sass", "--no-source-map", "static/scss:static/css"]]

[tool.tox.env.prettier]
skip_install = true
allowlist_externals = ["npx"]
commands = [["npx", "prettier", "--check", "{env:PRETTIER_GLOB}"]]

[tool.tox.env."toml-lint"]
skip_install = true
allowlist_externals = ["npx"]
commands = [
  [
    "npx",
    "@taplo/cli",
    "fmt",
    "--check",
    "--no-auto-config",
    "**/*.toml",
  ],
  [
    "npx",
    "@taplo/cli",
    "lint",
    "--no-auto-config",
    "**/*.toml",
  ],
]

# --- Duplication --------------------------------------------------------

# Zero-tolerance duplicate-code check (jscpd, config in .jscpd.json). Real
# duplication found should be refactored into a shared file the callers
# source/import, not waved off by raising the threshold.
[tool.tox.env."duplicate-code"]
skip_install = true
allowlist_externals = ["npx", "npm"]
commands = [["npm", "install", "--save-dev", "jscpd"], ["npx", "jscpd", "."]]

# --- Security -----------------------------------------------------------

[tool.tox.env."secret-detection"]
skip_install = true
allowlist_externals = ["docker"]
commands = [
  [
    "docker",
    "run",
    "--rm",
    "-v",
    "{toxinidir}:/repo",
    "trufflesecurity/trufflehog:latest",
    "git",
    "file:///repo",
    "--results=verified,unverified,unknown",
    "--fail",
  ],
]

# Local equivalent of the dedicated zizmor.yml GitHub Actions workflow (static
# analysis for GitHub Actions YAML -- catches template-injection, artipacked
# credential leaks, unpinned action refs, overly broad permissions). Not in
# env_list/github/all, same as secret-detection: enforced in CI via its own
# workflow, not the tox chain, and pip-installing zizmor needs network access.
[tool.tox.env.zizmor]
skip_install = true
allowlist_externals = ["pip", "zizmor"]
commands = [["pip", "install", "zizmor"], ["zizmor", "."]]

# --- Aggregate (CI) ---------------------------------------------------------

# Runs the full CI chain: lint → txt-lint → prettier → toml-lint → duplicate-code
[tool.tox.env.github]
skip_install = true
deps = []
allowlist_externals = ["tox"]
commands = [
  #   [
  #     "tox",
  #     "-e",
  #     "no-classes-check",
  #   ],
  ["tox", "-e", "lint"],
  ["tox", "-e", "txt-lint"],
  ["tox", "-e", "prettier"],
  ["tox", "-e", "toml-lint"],
  ["tox", "-e", "duplicate-code"],
  # ["tox", "-e", "combined-imports-check"],
]

# Runs format then the full github chain
[tool.tox.env.all]
skip_install = true
deps = []
allowlist_externals = ["tox"]
commands = [
  [
    "tox",
    "-e",
    "format",
  ],
  [
    "tox",
    "-e",
    "github",
  ],
  [
    "tox",
    "-e",
    "secret-detection",
  ],
  [
    "tox",
    "-e",
    "zizmor",
  ],
]